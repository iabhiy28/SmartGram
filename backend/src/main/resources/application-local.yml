# ============================================================================
# Local Standalone Profile (Zero external dependencies)
# ============================================================================
spring:
  datasource:
    url: jdbc:h2:mem:gramconnect_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    defer-datasource-initialization: true

  flyway:
    enabled: false # Hibernate handles DDL in memory mode

  cache:
    type: simple # In-memory concurrent map cache (no Redis needed for local run)

server:
  port: 8085

logging:
  level:
    root: INFO
    com.gramconnect: INFO
