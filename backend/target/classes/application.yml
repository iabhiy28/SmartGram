# ============================================================================
# GramConnect - Core Spring Boot Configuration
# ============================================================================
spring:
  application:
    name: gramconnect-backend
  profiles:
    active: dev

  # File upload limits (optimized for rural 2G/3G connections with client-side compression)
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 15MB
      enabled: true

  # JSON Serialization (Jackson)
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
    time-zone: Asia/Kolkata

# Server Configuration
server:
  port: 8080
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024

# OpenAPI / Swagger Documentation
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# Application-Specific Custom Properties
gramconnect:
  jwt:
    # 256-bit base64-encoded secret key for signing access tokens
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    access-token-expiration-ms: 900000 # 15 minutes (15 * 60 * 1000)
    refresh-token-expiration-ms: 604800000 # 7 days (7 * 24 * 60 * 60 * 1000)
  storage:
    upload-dir: ./uploads
    allowed-image-types: image/jpeg,image/png,image/webp
    max-file-size-bytes: 5242880 # 5 MB
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: Authorization,Content-Type,X-Requested-With,Accept,Origin,Access-Control-Request-Method,Access-Control-Request-Headers
    allow-credentials: true
    max-age: 3600
  sla:
    cron-expression: "0 */5 * * * *" # Every 5 minutes
